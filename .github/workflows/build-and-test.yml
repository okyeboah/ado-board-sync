name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares requires-python >=3.8, so the oldest supported
        # interpreter is tested alongside a current one.
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the CLI test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v

  desktop:
    name: Desktop (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # desktop/global.json is the one authoritative SDK pin (ABSD-105). Naming
          # a floating '10.0.x' here as well lets the runner land in a feature band
          # below the pin, which rollForward: latestFeature cannot reach — a hard
          # failure on a build that floats safely today.
          global-json-file: desktop/global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore
        run: dotnet restore desktop/AdoBoardSync.slnx

      - name: Build
        run: dotnet build desktop/AdoBoardSync.slnx --configuration Release --no-restore

      # The parity suite shells out to the CLI's Python modules. It is the gate
      # that keeps the .NET port from drifting from htmlfmt.py / parser.py /
      # config.py, so it must run here rather than only on a developer machine.
      - name: Test
        run: dotnet test desktop/AdoBoardSync.slnx --configuration Release --no-build
        env:
          ADO_BOARD_SYNC_PYTHON: python

  # The desktop job above runs the headless UI suite on ubuntu only. This lane
  # exists because the application is shipped per operating system: a build that
  # is green on ubuntu proves nothing about whether macOS and Windows can even
  # produce a runnable package (ABSD-506, ABSD-602).
  package:
    name: Package (${{ matrix.rid }})
    needs: desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # The same pin the desktop job uses, for the same reason: the lane that
          # publishes must not resolve a different SDK than the lane that gated it.
          global-json-file: desktop/global.json

      # Bash on the Windows runner too, so one script covers all three lanes
      # rather than a PowerShell fork nobody runs locally.
      - name: Publish self-contained
        shell: bash
        run: desktop/build/publish.sh ${{ matrix.rid }}

      # Before packaging, not after: this is the check that catches a build for
      # the wrong machine, and packaging it first spends 60-90s and ~100MB of I/O
      # on output that is about to be thrown away.
      - name: Check the published binary
        shell: bash
        run: desktop/build/verify.sh ${{ matrix.rid }}

      - name: Package
        shell: bash
        run: desktop/build/package.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: ado-board-sync-${{ matrix.rid }}
          path: desktop/artifacts/packages/
          if-no-files-found: error
          retention-days: 14
          # Every artifact here is a dmg, a zip or a tar.gz — already compressed.
          # Deflating them again costs runner time for no meaningful size gain.
          compression-level: 0
